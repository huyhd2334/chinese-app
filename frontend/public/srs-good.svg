<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <!-- Mini Chibi Tiểu Lu: Cười tít mắt hài lòng (Nhớ tốt) -->
  <defs>
    <radialGradient id="goodBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ears -->
  <circle cx="22" cy="22" r="11" fill="#31333b"/>
  <circle cx="22" cy="22" r="6" fill="#434752"/>
  <circle cx="58" cy="22" r="11" fill="#31333b"/>
  <circle cx="58" cy="22" r="6" fill="#434752"/>

  <!-- Chubby Head -->
  <circle cx="40" cy="42" r="28" fill="#ffffff" stroke="#eae0d5" stroke-width="1.5"/>

  <!-- Scholar Cap -->
  <path d="M33 16 C33 10 37 8 40 8 C43 8 47 10 47 16 Z" fill="#366c5d"/>
  <rect x="31" y="15" width="18" height="3" rx="1.5" fill="#20453b"/>
  <circle cx="40" cy="12" r="2" fill="#d4af37"/>

  <!-- Eye Patches -->
  <ellipse cx="28" cy="38" rx="8" ry="10" fill="#31333b" transform="rotate(-8 28 38)"/>
  <ellipse cx="52" cy="38" rx="8" ry="10" fill="#31333b" transform="rotate(8 52 38)"/>

  <!-- Happy Crescent Eyes (Mắt cười tít ^_^) -->
  <path d="M24 38 C26 34 30 34 32 38" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M48 38 C50 34 54 34 56 38" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="22" cy="48" rx="6" ry="4" fill="url(#goodBlush)"/>
  <ellipse cx="58" cy="48" rx="6" ry="4" fill="url(#goodBlush)"/>

  <!-- Nose & Sweet Smile -->
  <circle cx="40" cy="43" r="1.8" fill="#31333b"/>
  <path d="M36 47 C38 51 42 51 44 47" fill="none" stroke="#31333b" stroke-width="2" stroke-linecap="round"/>

  <!-- Little Sparkle near cheek -->
  <path d="M64 26 Q64 30 68 30 Q64 30 64 34 Q64 30 60 30 Q64 30 64 26 Z" fill="#366c5d"/>
</svg>
