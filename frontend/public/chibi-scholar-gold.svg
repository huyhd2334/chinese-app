<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Imperial Gold Gradient -->
    <linearGradient id="jinshiGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae588"/>
      <stop offset="50%" stop-color="#e9c46a"/>
      <stop offset="100%" stop-color="#b38a19"/>
    </linearGradient>

    <!-- Crimson Trim Gradient -->
    <linearGradient id="jinshiCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b7094c"/>
      <stop offset="50%" stop-color="#890620"/>
      <stop offset="100%" stop-color="#5c0011"/>
    </linearGradient>

    <radialGradient id="jinshiBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0"/>
    </radialGradient>

    <filter id="jinshiShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#5c0011" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .jinshi-bob {
      animation: jinshiBob 3.4s ease-in-out infinite;
      transform-origin: 200px 220px;
    }
    .wing-flutter {
      animation: wingFlutter 3.4s ease-in-out infinite alternate;
      transform-origin: 200px 95px;
    }

    @keyframes jinshiBob {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-5px) rotate(-1deg); }
    }

    @keyframes wingFlutter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(2deg) translateY(-1px); }
    }
  </style>

  <!-- Golden Radiance Base -->
  <g opacity="0.8">
    <ellipse cx="200" cy="340" rx="105" ry="22" fill="#fef3c7" opacity="0.6"/>
    <ellipse cx="200" cy="344" rx="70" ry="13" fill="#fde68a" opacity="0.5"/>
  </g>

  <!-- MAIN CHARACTER GROUP -->
  <g class="jinshi-bob" filter="url(#jinshiShadow)">
    
    <!-- IMPERIAL ROBE (ÁO TIẾN SĨ VÀNG KIM) -->
    <path d="M 120 280 C 110 240, 140 220, 165 215 L 235 215 C 260 220, 290 240, 280 280 C 275 320, 260 330, 200 330 C 140 330, 125 320, 120 280 Z" 
          fill="url(#jinshiGold)"/>

    <!-- Sleeves -->
    <path d="M 150 225 C 110 240, 95 280, 130 305 C 145 300, 160 270, 165 240 Z" fill="#b38a19"/>
    <path d="M 250 225 C 290 240, 305 280, 270 305 C 255 300, 240 270, 235 240 Z" fill="#b38a19"/>

    <!-- Crimson Trim (Cổ áo gấm viền son thêu chỉ đỏ) -->
    <path d="M 165 215 L 205 280 L 195 280 L 155 218 Z" fill="url(#jinshiCrimson)"/>
    <path d="M 235 215 L 180 290 L 195 295 L 245 220 Z" fill="url(#jinshiCrimson)"/>

    <!-- Imperial Belt with Ruby Gem (Thắt lưng đai hồng ngọc) -->
    <rect x="165" y="285" width="70" height="12" rx="4" fill="#890620"/>
    <ellipse cx="200" cy="291" rx="8" ry="7" fill="#ff4d6d" stroke="#5c0011" stroke-width="2"/>
    <circle cx="200" cy="291" r="3" fill="#ffe3e3"/>

    <!-- PANDA EARS -->
    <circle cx="135" cy="110" r="32" fill="#2b2b2b"/>
    <circle cx="137" cy="112" r="20" fill="#3d3d3d"/>
    
    <circle cx="265" cy="110" r="32" fill="#2b2b2b"/>
    <circle cx="263" cy="112" r="20" fill="#3d3d3d"/>

    <!-- HEAD -->
    <ellipse cx="200" cy="165" rx="84" ry="72" fill="#ffffff" stroke="#f1efe8" stroke-width="2"/>

    <!-- MŨ QUAN TRẠNG NGUYÊN CÁNH CHUỒN (JINSHI WINGED HAT) -->
    <g class="wing-flutter">
      <!-- Left Hat Wing (Cánh chuồn trái) -->
      <path d="M 145 92 C 90 92, 50 105, 55 118 C 65 125, 110 110, 150 102 Z" fill="#2b2b2b" stroke="#1f1f1f" stroke-width="2"/>
      <ellipse cx="65" cy="115" rx="5" ry="3" fill="#e9c46a"/>

      <!-- Right Hat Wing (Cánh chuồn phải) -->
      <path d="M 255 92 C 310 92, 350 105, 345 118 C 335 125, 290 110, 250 102 Z" fill="#2b2b2b" stroke="#1f1f1f" stroke-width="2"/>
      <ellipse cx="335" cy="115" rx="5" ry="3" fill="#e9c46a"/>

      <!-- Central Official Hat Cap -->
      <path d="M 160 115 C 160 78, 240 78, 240 115 Z" fill="#1f1f1f"/>
      <rect x="155" y="110" width="90" height="14" rx="4" fill="#2b2b2b"/>
      <line x1="155" y1="120" x2="245" y2="120" stroke="#e9c46a" stroke-width="2.5"/>

      <!-- Central Imperial Pearl / Ruby Jewel -->
      <circle cx="200" cy="94" r="8" fill="#c8102e" stroke="#e9c46a" stroke-width="2"/>
      <circle cx="198" cy="91" r="2" fill="#ffffff"/>
    </g>

    <!-- EYE PATCHES -->
    <ellipse cx="165" cy="165" rx="22" ry="26" transform="rotate(-15 165 165)" fill="#2b2b2b"/>
    <ellipse cx="235" cy="165" rx="22" ry="26" transform="rotate(15 235 165)" fill="#2b2b2b"/>

    <!-- EYES: Sparkling Happy & Proud Eyes -->
    <ellipse cx="166" cy="164" rx="10" ry="12" fill="#ffffff"/>
    <circle cx="167" cy="161" r="5" fill="#1b1b1b"/>
    <circle cx="164" cy="159" r="2" fill="#ffffff"/>
    <circle cx="168" cy="165" r="1.2" fill="#ffffff"/>

    <ellipse cx="234" cy="164" rx="10" ry="12" fill="#ffffff"/>
    <circle cx="233" cy="161" r="5" fill="#1b1b1b"/>
    <circle cx="231" cy="159" r="2" fill="#ffffff"/>
    <circle cx="235" cy="165" r="1.2" fill="#ffffff"/>

    <!-- NOSE & PROUD SCHOLAR SMILE -->
    <path d="M 194 180 C 194 176, 206 176, 206 180 C 206 185, 194 185, 194 180 Z" fill="#2b2b2b"/>
    <path d="M 200 183 L 200 188 C 194 194 190 193 186 190 M 200 188 C 206 194 210 193 214 190" 
          stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- BLUSH -->
    <ellipse cx="145" cy="182" rx="14" ry="8" fill="url(#jinshiBlush)"/>
    <ellipse cx="255" cy="182" rx="14" ry="8" fill="url(#jinshiBlush)"/>

    <!-- HOLDING IMPERIAL BOARD / GRAMMAR NOTE SCROLL (BẢNG NGỮ PHÁP) -->
    <!-- Left Paw holding board -->
    <circle cx="150" cy="275" r="16" fill="#2b2b2b"/>

    <!-- Imperial Grammar Tablet (Hốt ngà trạng nguyên ghi chú ngữ pháp) -->
    <g transform="translate(150, 230)">
      <rect x="0" y="0" width="100" height="55" rx="8" fill="#fffdfa" stroke="#d4af37" stroke-width="2.5"/>
      <rect x="5" y="5" width="90" height="45" rx="4" fill="#faf8f5" stroke="#fae588" stroke-width="1"/>
      
      <!-- Characters: "语法" (Ngữ pháp) -->
      <text x="22" y="34" font-family="'Noto Serif SC', serif" font-size="20" font-weight="bold" fill="#890620">语</text>
      <text x="56" y="34" font-family="'Noto Serif SC', serif" font-size="20" font-weight="bold" fill="#890620">法</text>

      <!-- Mini Imperial Seal -->
      <rect x="80" y="27" width="11" height="13" rx="2" fill="#d4af37"/>
      <circle cx="85.5" cy="33.5" r="3" fill="#ffffff"/>
    </g>

    <!-- Right Paw -->
    <circle cx="255" cy="275" r="16" fill="#2b2b2b"/>
  </g>
</svg>
