<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Jade Dragon Body Gradient -->
    <linearGradient id="dragonJade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48ca9b"/>
      <stop offset="50%" stop-color="#2ca579"/>
      <stop offset="100%" stop-color="#1b7855"/>
    </linearGradient>

    <!-- Golden Antlers Gradient -->
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff085"/>
      <stop offset="50%" stop-color="#f5be38"/>
      <stop offset="100%" stop-color="#d4920a"/>
    </linearGradient>

    <!-- Soft Cream Dragon Belly -->
    <linearGradient id="dragonBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefae0"/>
      <stop offset="100%" stop-color="#faedcd"/>
    </linearGradient>

    <!-- Celestial Cloud -->
    <linearGradient id="celestialCloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Table Wood -->
    <linearGradient id="tableWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a0714f"/>
      <stop offset="100%" stop-color="#6e462c"/>
    </linearGradient>

    <!-- Cheek Blush -->
    <radialGradient id="dragonBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .dragon-breathe {
      animation: dragonFloat 3.8s ease-in-out infinite;
      transform-origin: 200px 280px;
    }
    .dragon-antlers {
      animation: antlerSway 4.2s ease-in-out infinite;
      transform-origin: 200px 130px;
    }
    .dragon-blink {
      animation: eyeBlink 4s ease-in-out infinite;
      transform-origin: 200px 172px;
    }
    .tail-wag {
      animation: tailSway 3.2s ease-in-out infinite;
      transform-origin: 280px 290px;
    }
    .tea-steam {
      animation: steamRise 3s ease-in-out infinite;
      transform-origin: 290px 285px;
    }

    @keyframes dragonFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.01); }
    }
    @keyframes antlerSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
    }
    @keyframes tailSway {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes eyeBlink {
      0%, 94%, 98%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes steamRise {
      0% { opacity: 0; transform: translateY(4px) scale(0.85); }
      50% { opacity: 0.65; transform: translateY(-4px) scale(1); }
      100% { opacity: 0; transform: translateY(-12px) scale(1.15); }
    }
  </style>

  <!-- Celestial Cloud Base -->
  <g filter="url(#softShadow)">
    <ellipse cx="200" cy="350" rx="145" ry="32" fill="url(#celestialCloud)"/>
    <ellipse cx="140" cy="340" rx="45" ry="24" fill="#ffffff"/>
    <ellipse cx="260" cy="340" rx="45" ry="24" fill="#ffffff"/>
  </g>

  <!-- DRAGON TAIL (Đuôi rồng ngọc ngoe nguẩy) -->
  <g class="tail-wag">
    <path d="M 270 280 C 310 270, 345 285, 340 315 C 335 330, 310 325, 290 305 Z" fill="url(#dragonJade)"/>
    <!-- Golden Flame Tail Tuft (Chùm lông đuôi lửa vàng) -->
    <path d="M 335 310 Q 360 295 365 315 Q 355 335 335 325 Z" fill="url(#dragonGold)"/>
  </g>

  <!-- MAIN DRAGON BODY -->
  <g class="dragon-breathe" filter="url(#softShadow)">
    <!-- Dragon Chubby Body -->
    <ellipse cx="200" cy="275" rx="72" ry="68" fill="url(#dragonJade)"/>

    <!-- Dragon Belly (Bụng mềm màu kem với ngấn vảy) -->
    <ellipse cx="200" cy="282" rx="48" ry="46" fill="url(#dragonBelly)"/>
    <path d="M 172 268 Q 200 278 228 268" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 168 288 Q 200 298 232 288" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 175 308 Q 200 318 225 308" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Dragon Back Dorsal Fins (Gai lưng vàng óng) -->
    <polygon points="196,105 204,105 200,90" fill="url(#dragonGold)"/>
    <polygon points="196,122 204,122 200,108" fill="url(#dragonGold)"/>

    <!-- DRAGON ANTLERS / HORNS (Sừng rồng hoàng kim quý phái) -->
    <g class="dragon-antlers">
      <!-- Left Antler -->
      <path d="M 155 125 C 145 95, 120 70, 105 60 C 115 75, 128 85, 135 110 C 122 100, 110 98, 100 102 C 115 112, 128 116, 142 128 Z" fill="url(#dragonGold)"/>
      <!-- Right Antler -->
      <path d="M 245 125 C 255 95, 280 70, 295 60 C 285 75, 272 85, 265 110 C 278 100, 290 98, 300 102 C 285 112, 272 116, 258 128 Z" fill="url(#dragonGold)"/>
    </g>

    <!-- DRAGON HEAD (Đầu rồng ngọc bích tròn trĩnh) -->
    <circle cx="200" cy="170" r="76" fill="url(#dragonJade)"/>

    <!-- Dragon Ears / Fins (Vây tai rồng mềm mại) -->
    <ellipse cx="128" cy="165" rx="20" ry="14" fill="url(#dragonJade)" transform="rotate(-20 128 165)"/>
    <ellipse cx="128" cy="165" rx="13" ry="8" fill="url(#dragonGold)" transform="rotate(-20 128 165)"/>

    <ellipse cx="272" cy="165" rx="20" ry="14" fill="url(#dragonJade)" transform="rotate(20 272 165)"/>
    <ellipse cx="272" cy="165" rx="13" ry="8" fill="url(#dragonGold)" transform="rotate(20 272 165)"/>

    <!-- Snout / Muzzle (Mõm rồng phính màu ngọc nhạt) -->
    <ellipse cx="200" cy="192" rx="52" ry="34" fill="#cbf3e4"/>

    <!-- Cute Nostrils -->
    <ellipse cx="188" cy="186" rx="4" ry="5.5" fill="#1b7855"/>
    <ellipse cx="212" cy="186" rx="4" ry="5.5" fill="#1b7855"/>

    <!-- Sweet Smiling Dragon Mouth -->
    <path d="M 188 198 Q 200 210 212 198" fill="none" stroke="#1b7855" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Dragon Whiskers (Râu rồng hoàng kim dễ thương) -->
    <path d="M 160 190 Q 135 185 118 202" fill="none" stroke="url(#dragonGold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 240 190 Q 265 185 282 202" fill="none" stroke="url(#dragonGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- Cute Chubby Cheeks Blush -->
    <circle cx="150" cy="190" r="16" fill="url(#dragonBlush)"/>
    <circle cx="250" cy="190" r="16" fill="url(#dragonBlush)"/>

    <!-- Forehead Pearl Mark (Ấn ngọc quý tộc trên trán) -->
    <ellipse cx="200" cy="132" rx="8" ry="11" fill="url(#dragonGold)"/>
    <circle cx="200" cy="130" r="4.5" fill="#ffffff"/>

    <!-- SPARKLING EYES (Đôi mắt rồng long lanh) -->
    <g class="dragon-blink">
      <!-- Left Eye -->
      <ellipse cx="166" cy="162" rx="13" ry="16" fill="#111827"/>
      <ellipse cx="166" cy="164" rx="11" ry="14" fill="#1f2937"/>
      <!-- Highlights -->
      <circle cx="162" cy="157" r="5" fill="#ffffff"/>
      <circle cx="170" cy="168" r="2.5" fill="#ffffff"/>
      <ellipse cx="166" cy="172" rx="6" ry="2.5" fill="#f5be38" opacity="0.8"/>

      <!-- Right Eye -->
      <ellipse cx="234" cy="162" rx="13" ry="16" fill="#111827"/>
      <ellipse cx="234" cy="164" rx="11" ry="14" fill="#1f2937"/>
      <!-- Highlights -->
      <circle cx="230" cy="157" r="5" fill="#ffffff"/>
      <circle cx="238" cy="168" r="2.5" fill="#ffffff"/>
      <ellipse cx="234" cy="172" rx="6" ry="2.5" fill="#f5be38" opacity="0.8"/>
    </g>

    <!-- Scholar Headpiece: Golden Mini Crown / Hair Tuft -->
    <path d="M 190 108 Q 200 86 210 108 Z" fill="url(#dragonGold)"/>
  </g>

  <!-- STUDY DESK & BAMBOO SCROLL (Bàn học gỗ lim và cuộn sách tre HSK) -->
  <g filter="url(#softShadow)">
    <!-- Wooden Desk -->
    <path d="M 90 288 L 310 288 L 325 330 L 75 330 Z" fill="url(#tableWood)"/>
    <rect x="75" y="330" width="250" height="12" rx="4" fill="#54331d"/>

    <!-- Open HSK Study Book / Bamboo Scroll -->
    <rect x="135" y="294" width="130" height="28" rx="4" fill="#fefae0" stroke="#d4af37" stroke-width="1.5"/>
    <line x1="200" y1="294" x2="200" y2="322" stroke="#d4af37" stroke-width="1.5"/>
    <!-- Book Text Lines (Chữ Hán mô phỏng) -->
    <line x1="145" y1="302" x2="190" y2="302" stroke="#997b66" stroke-width="2" stroke-linecap="round"/>
    <line x1="145" y1="310" x2="185" y2="310" stroke="#997b66" stroke-width="2" stroke-linecap="round"/>
    <line x1="145" y1="316" x2="175" y2="316" stroke="#c8102e" stroke-width="2" stroke-linecap="round"/>

    <line x1="210" y1="302" x2="255" y2="302" stroke="#997b66" stroke-width="2" stroke-linecap="round"/>
    <line x1="210" y1="310" x2="250" y2="310" stroke="#997b66" stroke-width="2" stroke-linecap="round"/>
    <line x1="210" y1="316" x2="240" y2="316" stroke="#997b66" stroke-width="2" stroke-linecap="round"/>

    <!-- Little Dragon Paws resting on desk -->
    <ellipse cx="140" cy="292" rx="14" ry="10" fill="url(#dragonJade)"/>
    <ellipse cx="260" cy="292" rx="14" ry="10" fill="url(#dragonJade)"/>

    <!-- Jade Teacup on side -->
    <ellipse cx="290" cy="308" rx="12" ry="7" fill="#48ca9b"/>
    <path d="M 278 308 C 278 318, 302 318, 302 308 Z" fill="#2ca579"/>

    <!-- Rising Tea Steam -->
    <path class="tea-steam" d="M 290 298 Q 295 288 288 280 Q 292 272 288 266" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
