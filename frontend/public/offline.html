<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c0392b" />
    <title>Không có kết nối - HSK Learning</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #faf8f5; color: #2b2b2b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
      .card { max-width: 360px; }
      .logo { width: 72px; height: 72px; border-radius: 18px; background: #c0392b; color: #fff; font-size: 40px; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; color: #6b6b6b; line-height: 1.6; margin: 0 0 20px; }
      button { background: #c0392b; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">学</div>
      <h1>Bạn đang ngoại tuyến</h1>
      <p>Trang này chưa được lưu để dùng offline. Các bài học bạn đã mở trước đó vẫn xem được. Hãy kết nối mạng và thử lại nhé.</p>
      <button onclick="location.reload()">Thử lại</button>
    </div>
  </body>
</html>
