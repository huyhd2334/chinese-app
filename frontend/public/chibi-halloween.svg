<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Magic Moon Glow -->
    <radialGradient id="halloweenMoonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fb8500" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3a0ca3" stop-opacity="0"/>
    </radialGradient>

    <!-- Hat & Robe: Midnight Obsidian Purple -->
    <linearGradient id="witchPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a1259"/>
      <stop offset="50%" stop-color="#2d0a38"/>
      <stop offset="100%" stop-color="#190321"/>
    </linearGradient>

    <!-- Jade Dragon Gradient -->
    <linearGradient id="dragonJade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48ca9b"/>
      <stop offset="50%" stop-color="#2ca579"/>
      <stop offset="100%" stop-color="#1b7855"/>
    </linearGradient>

    <!-- Golden Antlers Gradient -->
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff085"/>
      <stop offset="50%" stop-color="#f5be38"/>
      <stop offset="100%" stop-color="#d4920a"/>
    </linearGradient>

    <!-- Cream Belly -->
    <linearGradient id="dragonBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefae0"/>
      <stop offset="100%" stop-color="#faedcd"/>
    </linearGradient>

    <!-- Pumpkin Orange Gradient -->
    <linearGradient id="pumpkinOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00"/>
      <stop offset="60%" stop-color="#e85d04"/>
      <stop offset="100%" stop-color="#9d0208"/>
    </linearGradient>

    <!-- Pumpkin Inner Candle Glow -->
    <radialGradient id="candleFire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="60%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </radialGradient>

    <!-- Gold Trim Gradient -->
    <linearGradient id="spookyGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe49e"/>
      <stop offset="50%" stop-color="#f4a261"/>
      <stop offset="100%" stop-color="#e76f51"/>
    </linearGradient>

    <!-- Blush -->
    <radialGradient id="dragonBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff4d6d" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="spookyShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#05010a" flood-opacity="0.45"/>
    </filter>

    <filter id="pumpkinGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .float-mascot {
      animation: halloweenFloat 3.8s ease-in-out infinite;
      transform-origin: 250px 320px;
    }
    .bat-flutter {
      animation: batFly 2.6s ease-in-out infinite alternate;
      transform-origin: 380px 110px;
    }
    .pumpkin-lantern {
      animation: pumpkinFlicker 3s ease-in-out infinite alternate;
      transform-origin: 250px 350px;
    }
    .tail-wag {
      animation: tailSway 2.8s ease-in-out infinite;
      transform-origin: 160px 370px;
    }
    .hat-sway {
      animation: hatTilt 3.8s ease-in-out infinite;
      transform-origin: 250px 170px;
    }

    @keyframes halloweenFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1deg);
      }
    }
    @keyframes hatTilt {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-2deg);
      }
    }
    @keyframes pumpkinFlicker {
      0% {
        filter: drop-shadow(0 0 10px rgba(255, 183, 3, 0.45));
      }
      100% {
        filter: drop-shadow(0 0 20px rgba(251, 133, 0, 0.8));
      }
    }
    @keyframes batFly {
      0% {
        transform: translateY(0px) rotate(-3deg);
      }
      100% {
        transform: translateY(-6px) rotate(4deg);
      }
    }
    @keyframes tailSway {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-8deg);
      }
    }
  </style>

  <!-- BACKGROUND MOON & MYSTIC AURA -->
  <circle cx="250" cy="250" r="235" fill="url(#halloweenMoonGlow)"/>

  <!-- FLYING HALLOWEEN BAT -->
  <g class="bat-flutter" filter="url(#spookyShadow)">
    <path d="M 380 95 Q 365 75 350 85 Q 360 100 355 110 Q 375 105 380 115 Q 385 105 405 110 Q 400 100 410 85 Q 395 75 380 95 Z" fill="#2d0a38"/>
    <circle cx="377" cy="98" r="1.5" fill="#ffb703"/>
    <circle cx="383" cy="98" r="1.5" fill="#ffb703"/>
  </g>

  <!-- FLOATING MAGIC CANDY & STARS -->
  <g>
    <!-- Little Star 1 -->
    <path d="M 90 120 Q 98 120 98 112 Q 98 120 106 120 Q 98 120 98 128 Q 98 120 90 120 Z" fill="url(#dragonGold)"/>
    <!-- Little Star 2 -->
    <path d="M 405 210 Q 412 210 412 203 Q 412 210 419 210 Q 412 210 412 217 Q 412 210 405 210 Z" fill="url(#dragonGold)"/>

    <!-- Cute Halloween Candy -->
    <rect x="75" y="240" width="18" height="12" rx="4" fill="url(#pumpkinOrange)" transform="rotate(-20 84 246)"/>
    <polygon points="66,242 75,246 68,252" fill="url(#witchPurple)" transform="rotate(-20 84 246)"/>
    <polygon points="101,240 92,246 99,250" fill="url(#witchPurple)" transform="rotate(-20 84 246)"/>
  </g>

  <!-- DRAGON TAIL (With witch fire tip) -->
  <g class="tail-wag">
    <path d="M 180 370 C 130 360, 90 380, 95 415 C 100 435, 130 430, 155 400 Z" fill="url(#dragonJade)"/>
    <!-- Golden Flame Tail Tuft -->
    <path d="M 95 410 Q 70 395 65 420 Q 80 440 100 428 Z" fill="url(#dragonGold)"/>
  </g>

  <!-- MAIN DRAGON CHARACTER (TIỂU LONG HALLOWEEN) -->
  <g class="float-mascot" filter="url(#spookyShadow)">
    <!-- Dragon Body -->
    <ellipse cx="250" cy="350" rx="90" ry="85" fill="url(#dragonJade)"/>

    <!-- Dragon Belly with soft cream & gold markings -->
    <ellipse cx="250" cy="358" rx="60" ry="58" fill="url(#dragonBelly)"/>
    <path d="M 215 340 Q 250 352 285 340" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <path d="M 210 365 Q 250 377 290 365" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <path d="M 218 390 Q 250 402 282 390" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>

    <!-- Dragon Feet -->
    <ellipse cx="195" cy="430" rx="24" ry="15" fill="url(#dragonJade)"/>
    <ellipse cx="305" cy="430" rx="24" ry="15" fill="url(#dragonJade)"/>

    <!-- GOLDEN ANTLERS (Poking out from hat sides) -->
    <!-- Left Antler -->
    <path d="M 195 160 C 180 120, 150 90, 130 75 C 142 95, 158 108, 168 140 C 150 128, 135 125, 122 130 C 142 142, 158 148, 175 165 Z" fill="url(#dragonGold)"/>
    <!-- Right Antler -->
    <path d="M 305 160 C 320 120, 350 90, 370 75 C 358 95, 342 108, 332 140 C 350 128, 365 125, 378 130 C 358 142, 342 148, 325 165 Z" fill="url(#dragonGold)"/>

    <!-- DRAGON HEAD -->
    <circle cx="250" cy="220" r="95" fill="url(#dragonJade)"/>

    <!-- Dragon Ears / Fins -->
    <ellipse cx="160" cy="215" rx="25" ry="18" fill="url(#dragonJade)" transform="rotate(-20 160 215)"/>
    <ellipse cx="160" cy="215" rx="16" ry="10" fill="url(#dragonGold)" transform="rotate(-20 160 215)"/>

    <ellipse cx="340" cy="215" rx="25" ry="18" fill="url(#dragonJade)" transform="rotate(20 340 215)"/>
    <ellipse cx="340" cy="215" rx="16" ry="10" fill="url(#dragonGold)" transform="rotate(20 340 215)"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="250" cy="250" rx="65" ry="42" fill="#cbf3e4"/>

    <!-- Cute Nostrils -->
    <ellipse cx="235" cy="242" rx="5" ry="7" fill="#1b7855"/>
    <ellipse cx="265" cy="242" rx="5" ry="7" fill="#1b7855"/>

    <!-- Cute Smiling Mouth with Tiny Dragon Fang -->
    <path d="M 235 258 Q 250 272 265 258" fill="none" stroke="#1b7855" stroke-width="4" stroke-linecap="round"/>
    <polygon points="242,260 246,268 250,260" fill="#ffffff"/>

    <!-- Golden Dragon Whiskers -->
    <path d="M 200 248 Q 168 242 145 264" fill="none" stroke="url(#dragonGold)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 300 248 Q 332 242 355 264" fill="none" stroke="url(#dragonGold)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Blushing Cheeks -->
    <circle cx="188" cy="246" r="20" fill="url(#dragonBlush)"/>
    <circle cx="312" cy="246" r="20" fill="url(#dragonBlush)"/>

    <!-- BIG PLAYFUL SPARKLING EYES -->
    <!-- Left Eye -->
    <ellipse cx="208" cy="210" rx="16" ry="20" fill="#111827"/>
    <ellipse cx="208" cy="212" rx="13" ry="17" fill="#1f2937"/>
    <circle cx="203" cy="204" r="6.5" fill="#ffffff"/>
    <circle cx="213" cy="218" r="3.2" fill="#ffffff"/>
    <ellipse cx="208" cy="222" rx="7" ry="3" fill="#f5be38" opacity="0.8"/>

    <!-- Right Eye -->
    <ellipse cx="292" cy="210" rx="16" ry="20" fill="#111827"/>
    <ellipse cx="292" cy="212" rx="13" ry="17" fill="#1f2937"/>
    <circle cx="287" cy="204" r="6.5" fill="#ffffff"/>
    <circle cx="297" cy="218" r="3.2" fill="#ffffff"/>
    <ellipse cx="292" cy="222" rx="7" ry="3" fill="#f5be38" opacity="0.8"/>

    <!-- Forehead Pearl Mark -->
    <ellipse cx="250" cy="172" rx="10" ry="14" fill="url(#dragonGold)"/>
    <circle cx="250" cy="170" r="5.5" fill="#ffffff"/>

    <!-- WIZARD / SORCERER HAT (Đội lệch quý tộc) -->
    <g class="hat-sway">
      <!-- Hat Brim (Vành mũ nhung tím cong vút) -->
      <ellipse cx="250" cy="155" rx="120" ry="24" fill="url(#witchPurple)" stroke="url(#spookyGold)" stroke-width="3" transform="rotate(-5 250 155)"/>

      <!-- Hat Cone (Chóp nón phù thủy uốn lượn) -->
      <path d="M 180 150 Q 220 80 270 30 Q 300 20 315 40 Q 290 90 320 140 Z" fill="url(#witchPurple)" filter="url(#spookyShadow)"/>

      <!-- Hat Band: Royal Gold Silk Ribbon -->
      <path d="M 195 146 Q 250 138 305 137 L 308 147 Q 250 148 193 156 Z" fill="url(#spookyGold)"/>

      <!-- Golden Buckle -->
      <rect x="238" y="136" width="24" height="18" rx="4" fill="none" stroke="url(#dragonGold)" stroke-width="4"/>
      <rect x="246" y="142" width="8" height="6" fill="url(#witchPurple)"/>

      <!-- Dangling Bell / Star from Tip of Hat -->
      <circle cx="315" cy="40" r="7" fill="url(#dragonGold)"/>
    </g>

    <!-- DRAGON PAWS HOLDING PUMPKIN -->
    <!-- Left Paw -->
    <ellipse cx="178" cy="342" rx="18" ry="24" fill="url(#dragonJade)" transform="rotate(-30 178 342)"/>
    <circle cx="168" cy="358" r="8" fill="url(#dragonJade)"/>

    <!-- Right Paw -->
    <ellipse cx="322" cy="342" rx="18" ry="24" fill="url(#dragonJade)" transform="rotate(30 322 342)"/>
    <circle cx="332" cy="358" r="8" fill="url(#dragonJade)"/>
  </g>

  <!-- GLOWING JACK-O'-LANTERN PUMPKIN (Lồng đèn bí ngô phát sáng ấm áp) -->
  <g class="pumpkin-lantern" filter="url(#pumpkinGlow)">
    <!-- Pumpkin Stalk (Cuống bí) -->
    <path d="M 248 312 Q 250 295 260 290 Q 256 305 253 312 Z" fill="#40916c"/>

    <!-- Pumpkin Back / Body Segments -->
    <ellipse cx="250" cy="360" rx="64" ry="48" fill="url(#pumpkinOrange)" filter="url(#spookyShadow)"/>
    <ellipse cx="220" cy="360" rx="38" ry="46" fill="url(#pumpkinOrange)"/>
    <ellipse cx="280" cy="360" rx="38" ry="46" fill="url(#pumpkinOrange)"/>
    <ellipse cx="250" cy="360" rx="32" ry="46" fill="url(#pumpkinOrange)"/>

    <!-- Pumpkin Rib Lines -->
    <path d="M 235 316 C 215 335 215 385 235 404" fill="none" stroke="#ba181b" stroke-width="2.5" opacity="0.6"/>
    <path d="M 265 316 C 285 335 285 385 265 404" fill="none" stroke="#ba181b" stroke-width="2.5" opacity="0.6"/>

    <!-- Glowing Pumpkin Carved Eyes -->
    <polygon points="228,345 242,345 235,332" fill="url(#candleFire)"/>
    <polygon points="258,345 272,345 265,332" fill="url(#candleFire)"/>

    <!-- Glowing Pumpkin Carved Nose -->
    <polygon points="250,352 245,360 255,360" fill="url(#candleFire)"/>

    <!-- Glowing Pumpkin Carved Grin -->
    <path d="M 224 372 Q 235 388 250 388 Q 265 388 276 372 Q 268 380 250 380 Q 232 380 224 372 Z" fill="url(#candleFire)"/>
    <!-- Pumpkin Teeth -->
    <polygon points="236,373 242,373 239,379" fill="url(#pumpkinOrange)"/>
    <polygon points="258,373 264,373 261,379" fill="url(#pumpkinOrange)"/>
  </g>
</svg>