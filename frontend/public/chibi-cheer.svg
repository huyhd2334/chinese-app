<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Jade Dragon Body Gradient -->
    <linearGradient id="cheerJadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48ca9b"/>
      <stop offset="50%" stop-color="#2ca579"/>
      <stop offset="100%" stop-color="#1b7855"/>
    </linearGradient>

    <!-- Golden Antlers & Trim Gradient -->
    <linearGradient id="cheerGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff085"/>
      <stop offset="50%" stop-color="#f5be38"/>
      <stop offset="100%" stop-color="#d4920a"/>
    </linearGradient>

    <!-- Dragon Belly -->
    <linearGradient id="cheerBellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fefae0"/>
      <stop offset="100%" stop-color="#faedcd"/>
    </linearGradient>

    <!-- Festive Imperial Red Banner -->
    <linearGradient id="bannerRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c8102e"/>
      <stop offset="50%" stop-color="#e82b48"/>
      <stop offset="100%" stop-color="#a80b24"/>
    </linearGradient>

    <!-- Cloud Base Gradient -->
    <linearGradient id="cheerCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Cheek Blush -->
    <radialGradient id="cheerBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow -->
    <filter id="cheerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .cheer-jump {
      animation: dragonCheerJump 2.4s ease-in-out infinite;
      transform-origin: 200px 300px;
    }
    .banner-wave {
      animation: bannerWave 2.4s ease-in-out infinite;
      transform-origin: 200px 90px;
    }
    .tail-wag {
      animation: tailCheerWag 1.8s ease-in-out infinite;
      transform-origin: 270px 290px;
    }
    .confetti-pop-1 {
      animation: popSparkle 2s ease-in-out infinite alternate;
    }
    .confetti-pop-2 {
      animation: popSparkle 2s ease-in-out infinite alternate 1s;
    }

    @keyframes dragonCheerJump {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      40% {
        transform: translateY(-16px) scale(1.03);
      }
      70% {
        transform: translateY(-6px) scale(1.01);
      }
    }
    @keyframes bannerWave {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(2deg) translateY(-2px);
      }
    }
    @keyframes tailCheerWag {
      0%, 100% {
        transform: rotate(-4deg);
      }
      50% {
        transform: rotate(10deg);
      }
    }
    @keyframes popSparkle {
      0% {
        opacity: 0.35;
        transform: scale(0.85);
      }
      100% {
        opacity: 1;
        transform: scale(1.18);
      }
    }
  </style>

  <!-- CELESTIAL AUSPICIOUS CLOUDS -->
  <g filter="url(#cheerShadow)">
    <ellipse cx="200" cy="358" rx="145" ry="32" fill="url(#cheerCloudGrad)"/>
    <ellipse cx="130" cy="350" rx="48" ry="24" fill="#ffffff"/>
    <ellipse cx="270" cy="350" rx="48" ry="24" fill="#ffffff"/>
    <!-- Golden cloud spiral accent -->
    <path d="M 125 352 Q 135 344 145 352 Q 155 360 148 364" fill="none" stroke="url(#cheerGoldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 255 352 Q 265 344 275 352 Q 285 360 278 364" fill="none" stroke="url(#cheerGoldGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- CONFETTI & GOLDEN STARS CELEBRATION -->
  <g class="confetti-pop-1">
    <!-- Gold 4-point stars -->
    <path d="M 65 140 Q 75 140 75 130 Q 75 140 85 140 Q 75 140 75 150 Q 75 140 65 140 Z" fill="url(#cheerGoldGrad)"/>
    <path d="M 330 130 Q 340 130 340 120 Q 340 130 350 130 Q 340 130 340 140 Q 340 130 330 130 Z" fill="url(#cheerGoldGrad)"/>
    <circle cx="95" cy="180" r="4.5" fill="#e82b48"/>
    <circle cx="310" cy="190" r="5" fill="#48ca9b"/>
    <circle cx="60" cy="220" r="4" fill="#ffd166"/>
    <rect x="330" y="225" width="8" height="8" rx="2" fill="#ffd166" transform="rotate(25 334 229)"/>
  </g>
  <g class="confetti-pop-2">
    <path d="M 90 85 Q 98 85 98 77 Q 98 85 106 85 Q 98 85 98 93 Q 98 85 90 85 Z" fill="url(#cheerGoldGrad)"/>
    <path d="M 305 75 Q 313 75 313 67 Q 313 75 321 75 Q 313 75 313 83 Q 313 75 305 75 Z" fill="url(#cheerGoldGrad)"/>
    <circle cx="80" cy="115" r="3.5" fill="#48ca9b"/>
    <circle cx="325" cy="105" r="4" fill="#e82b48"/>
    <rect x="110" y="60" width="7" height="7" rx="2" fill="#f5be38" transform="rotate(40 113 63)"/>
    <rect x="290" y="55" width="7" height="7" rx="2" fill="#e82b48" transform="rotate(15 293 58)"/>
  </g>

  <!-- DRAGON TAIL (Wagging joyfully) -->
  <g class="tail-wag">
    <path d="M 265 275 C 310 255, 350 270, 352 305 C 350 325, 320 325, 290 300 Z" fill="url(#cheerJadeGrad)"/>
    <!-- Golden Flame Tail Tuft -->
    <path d="M 345 295 Q 375 285 378 308 Q 365 328 345 315 Z" fill="url(#cheerGoldGrad)"/>
  </g>

  <!-- MAIN DRAGON (Jumping & Cheering) -->
  <g class="cheer-jump" filter="url(#cheerShadow)">
    <!-- Dragon Body -->
    <ellipse cx="200" cy="270" rx="72" ry="68" fill="url(#cheerJadeGrad)"/>

    <!-- Dragon Belly with golden rings -->
    <ellipse cx="200" cy="276" rx="48" ry="46" fill="url(#cheerBellyGrad)"/>
    <path d="M 172 262 Q 200 272 228 262" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 168 282 Q 200 292 232 282" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 175 302 Q 200 312 225 302" fill="none" stroke="#d4af37" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Golden Dorsal Fins -->
    <polygon points="196,100 204,100 200,85" fill="url(#cheerGoldGrad)"/>
    <polygon points="196,118 204,118 200,104" fill="url(#cheerGoldGrad)"/>

    <!-- Little Dragon Feet -->
    <ellipse cx="160" cy="336" rx="20" ry="12" fill="url(#cheerJadeGrad)"/>
    <ellipse cx="240" cy="336" rx="20" ry="12" fill="url(#cheerJadeGrad)"/>
    <circle cx="152" cy="338" r="3" fill="url(#cheerGoldGrad)"/>
    <circle cx="160" cy="340" r="3" fill="url(#cheerGoldGrad)"/>
    <circle cx="168" cy="338" r="3" fill="url(#cheerGoldGrad)"/>
    <circle cx="232" cy="338" r="3" fill="url(#cheerGoldGrad)"/>
    <circle cx="240" cy="340" r="3" fill="url(#cheerGoldGrad)"/>
    <circle cx="248" cy="338" r="3" fill="url(#cheerGoldGrad)"/>

    <!-- GOLDEN ANTLERS -->
    <!-- Left Antler -->
    <path d="M 152 120 C 142 90, 116 66, 100 56 C 110 72, 124 82, 132 106 C 118 96, 106 94, 96 98 C 112 108, 125 112, 138 124 Z" fill="url(#cheerGoldGrad)"/>
    <!-- Right Antler -->
    <path d="M 248 120 C 258 90, 284 66, 300 56 C 290 72, 276 82, 268 106 C 282 96, 294 94, 304 98 C 288 108, 275 112, 262 124 Z" fill="url(#cheerGoldGrad)"/>

    <!-- DRAGON HEAD -->
    <circle cx="200" cy="165" r="76" fill="url(#cheerJadeGrad)"/>

    <!-- Dragon Ears / Fins -->
    <ellipse cx="126" cy="160" rx="20" ry="14" fill="url(#cheerJadeGrad)" transform="rotate(-20 126 160)"/>
    <ellipse cx="126" cy="160" rx="13" ry="8" fill="url(#cheerGoldGrad)" transform="rotate(-20 126 160)"/>

    <ellipse cx="274" cy="160" rx="20" ry="14" fill="url(#cheerJadeGrad)" transform="rotate(20 274 160)"/>
    <ellipse cx="274" cy="160" rx="13" ry="8" fill="url(#cheerGoldGrad)" transform="rotate(20 274 160)"/>

    <!-- Forehead Pearl Mark -->
    <ellipse cx="200" cy="126" rx="8" ry="11" fill="url(#cheerGoldGrad)"/>
    <circle cx="200" cy="124" r="4.5" fill="#ffffff"/>

    <!-- Snout / Muzzle -->
    <ellipse cx="200" cy="188" rx="52" ry="34" fill="#cbf3e4"/>

    <!-- Cute Nostrils -->
    <ellipse cx="188" cy="182" rx="4" ry="5.5" fill="#1b7855"/>
    <ellipse cx="212" cy="182" rx="4" ry="5.5" fill="#1b7855"/>

    <!-- Big Happy Open Smile (Rồng cười mừng rỡ) -->
    <path d="M 182 192 Q 200 220 218 192 Z" fill="#9d0208"/>
    <path d="M 188 206 Q 200 220 212 206 Z" fill="#ff758f"/>

    <!-- Golden Whiskers -->
    <path d="M 158 186 Q 132 178 114 196" fill="none" stroke="url(#cheerGoldGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 242 186 Q 268 178 286 196" fill="none" stroke="url(#cheerGoldGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheerful Blushing Cheeks -->
    <circle cx="148" cy="184" r="17" fill="url(#cheerBlush)"/>
    <circle cx="252" cy="184" r="17" fill="url(#cheerBlush)"/>

    <!-- HAPPY JOYFUL EYES (Hình vòng cung cười tít mắt) -->
    <path d="M 154 158 Q 166 144 178 158" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 222 158 Q 234 144 246 158" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round"/>

    <!-- DRAGON ARMS (Raised up holding the banner) -->
    <ellipse cx="132" cy="225" rx="15" ry="24" fill="url(#cheerJadeGrad)" transform="rotate(-35 132 225)"/>
    <circle cx="120" cy="204" r="11" fill="url(#cheerJadeGrad)"/>

    <ellipse cx="268" cy="225" rx="15" ry="24" fill="url(#cheerJadeGrad)" transform="rotate(35 268 225)"/>
    <circle cx="280" cy="204" r="11" fill="url(#cheerJadeGrad)"/>
  </g>

  <!-- IMPERIAL CHEERING BANNER: 太棒了 (Tài bàng le! / Xuất sắc!) -->
  <g class="banner-wave" filter="url(#cheerShadow)">
    <!-- Silk Ribbon / Scroll Body -->
    <path d="M 105 75 Q 200 60 295 75 L 290 115 Q 200 100 110 115 Z" fill="url(#bannerRedGrad)"/>
    <!-- Banner Gold Trim Top & Bottom -->
    <path d="M 105 75 Q 200 60 295 75" fill="none" stroke="url(#cheerGoldGrad)" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 110 115 Q 200 100 290 115" fill="none" stroke="url(#cheerGoldGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Banner Scroll Knobs (Đầu trục liễn hoàng kim) -->
    <rect x="98" y="70" width="10" height="50" rx="3" fill="url(#cheerGoldGrad)"/>
    <rect x="292" y="70" width="10" height="50" rx="3" fill="url(#cheerGoldGrad)"/>

    <!-- Red Silk Tassels Hanging Down -->
    <line x1="103" y1="120" x2="103" y2="140" stroke="#f5be38" stroke-width="2"/>
    <polygon points="100,140 106,140 103,148" fill="#e82b48"/>

    <line x1="297" y1="120" x2="297" y2="140" stroke="#f5be38" stroke-width="2"/>
    <polygon points="294,140 300,140 297,148" fill="#e82b48"/>

    <!-- Banner Inscription: "太棒了" (Tài Bàng Le - Quá Xuất Sắc!) -->
    <text x="200" y="98" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="22" font-weight="900" fill="#fff085" text-anchor="middle" letter-spacing="4" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.5))">太棒了!</text>
  </g>
</svg>