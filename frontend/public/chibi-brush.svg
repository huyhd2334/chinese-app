<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="brushCloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbf5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f5ede0" stop-opacity="0.75"/>
    </linearGradient>

    <linearGradient id="brushGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce594"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a8851b"/>
    </linearGradient>

    <linearGradient id="brushJadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ca38e"/>
      <stop offset="100%" stop-color="#2d5e51"/>
    </linearGradient>

    <radialGradient id="brushBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0"/>
    </radialGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2b2b2b" flood-opacity="0.08"/>
    </filter>
  </defs>

  <style>
    .brush-sway {
      animation: brushSway 3.2s ease-in-out infinite;
      transform-origin: 260px 220px;
    }
    .panda-nod {
      animation: pandaNod 3.2s ease-in-out infinite;
      transform-origin: 200px 290px;
    }
    .ink-trail {
      animation: inkFloat 3s ease-in-out infinite alternate;
    }
    .magic-sparkle {
      animation: twinkle 2.4s ease-in-out infinite alternate;
    }

    @keyframes brushSway {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(6deg) translateY(-3px);
      }
    }

    @keyframes pandaNod {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(0.8deg);
      }
    }

    @keyframes inkFloat {
      0% {
        stroke-dashoffset: 0;
        opacity: 0.7;
      }
      100% {
        stroke-dashoffset: 14;
        opacity: 0.95;
      }
    }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
      100% { opacity: 1; transform: scale(1.2) rotate(25deg); }
    }
  </style>

  <!-- Ambient Light Halo -->
  <circle cx="200" cy="205" r="140" fill="url(#brushCloudGrad)" opacity="0.6"/>
  <circle cx="200" cy="205" r="140" fill="none" stroke="#e6dbcc" stroke-width="2" stroke-dasharray="5 7" opacity="0.6"/>

  <!-- Floor Ground Shadow -->
  <ellipse cx="200" cy="340" rx="110" ry="16" fill="#2b2b2b" opacity="0.08"/>
  <ellipse cx="200" cy="338" rx="80" ry="10" fill="#2b2b2b" opacity="0.1"/>

  <!-- Bamboo Mat / Study Scroll on Floor -->
  <rect x="110" y="318" width="180" height="20" rx="8" fill="#e8d5b5" stroke="#cbb38b" stroke-width="1.5"/>
  <line x1="140" y1="318" x2="140" y2="338" stroke="#aa936f" stroke-width="1"/>
  <line x1="170" y1="318" x2="170" y2="338" stroke="#aa936f" stroke-width="1"/>
  <line x1="200" y1="318" x2="200" y2="338" stroke="#aa936f" stroke-width="1"/>
  <line x1="230" y1="318" x2="230" y2="338" stroke="#aa936f" stroke-width="1"/>
  <line x1="260" y1="318" x2="260" y2="338" stroke="#aa936f" stroke-width="1"/>

  <!-- Character Group -->
  <g class="panda-nod">
    <!-- Ears -->
    <g>
      <!-- Left Ear -->
      <circle cx="132" cy="136" r="26" fill="#31333b"/>
      <circle cx="132" cy="136" r="16" fill="#434752"/>
      <circle cx="135" cy="134" r="9" fill="#fca5a5" opacity="0.3"/>

      <!-- Right Ear -->
      <circle cx="268" cy="136" r="26" fill="#31333b"/>
      <circle cx="268" cy="136" r="16" fill="#434752"/>
      <circle cx="265" cy="134" r="9" fill="#fca5a5" opacity="0.3"/>
    </g>

    <!-- Chubby Body in Hanfu Robe -->
    <g id="brush-body">
      <ellipse cx="200" cy="275" rx="66" ry="48" fill="#ffffff"/>
      <path d="M142 278 C 158 315 242 315 258 278 C 248 298 226 310 200 310 C 174 310 152 298 142 278 Z" fill="#ebe4d8" opacity="0.6"/>

      <!-- Robe in China Red -->
      <path d="M145 258 C 145 288 160 308 200 308 C 240 308 255 288 255 258 C 245 250 225 244 200 244 C 175 244 155 250 145 258 Z" fill="#c8102e"/>
      <path d="M178 244 L 208 292" stroke="#f5d77f" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M222 244 L 195 284" stroke="#faf8f5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="206" cy="288" r="3.5" fill="#d4af37"/>
    </g>

    <!-- Head -->
    <g id="brush-head">
      <path d="M125 186 C 122 140 152 110 200 110 C 248 110 278 140 275 186 C 275 222 248 244 200 244 C 152 244 125 222 125 186 Z" fill="#ffffff" filter="url(#softShadow)"/>

      <!-- Eye Patches -->
      <ellipse cx="162" cy="178" rx="19" ry="23" fill="#31333b" transform="rotate(-12 162 178)"/>
      <ellipse cx="238" cy="178" rx="19" ry="23" fill="#31333b" transform="rotate(12 238 178)"/>

      <!-- Left Eye: Big, Sparkly & Proud -->
      <circle cx="164" cy="178" r="10" fill="#1e2026"/>
      <circle cx="162" cy="175" r="4.5" fill="#ffffff"/>
      <circle cx="168" cy="182" r="2.2" fill="#ffffff"/>

      <!-- Right Eye: Playful Wink (^_~) -->
      <path d="M228 179 C 234 172 244 172 250 179" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Cheeks -->
      <ellipse cx="146" cy="202" rx="14" ry="9" fill="url(#brushBlush)"/>
      <ellipse cx="254" cy="202" rx="14" ry="9" fill="url(#brushBlush)"/>

      <!-- Nose & Proud Cute Smile -->
      <circle cx="200" cy="192" r="3" fill="#31333b"/>
      <path d="M194 200 C 197 205 204 205 207 200" fill="none" stroke="#31333b" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Scholar Cap -->
      <path d="M180 112 C 180 102 188 96 200 96 C 212 96 220 102 220 112 Z" fill="url(#brushJadeGrad)"/>
      <rect x="176" y="109" width="48" height="5" rx="2.5" fill="#20453b"/>
      <circle cx="200" cy="104" r="4" fill="#f5d77f"/>
      <circle cx="200" cy="94" r="3" fill="#c8102e"/>
    </g>

    <!-- Left Paw holding Mastered Practice Paper ("通" - Pass / Master) -->
    <g>
      <rect x="120" y="240" width="44" height="56" rx="6" fill="#fffdfa" stroke="#eae0d5" stroke-width="1.5" transform="rotate(-8 142 268)" filter="url(#softShadow)"/>
      <text x="138" y="274" font-family="'Noto Serif SC', serif" font-size="22" fill="#c8102e" font-weight="900" text-anchor="middle" transform="rotate(-8 142 268)">通</text>
      <!-- Seal stamp -->
      <rect x="146" y="274" width="8" height="8" rx="2" fill="#c8102e" opacity="0.75" transform="rotate(-8 142 268)"/>
      <!-- Paw -->
      <circle cx="160" cy="265" r="11" fill="#31333b"/>
    </g>

    <!-- Right Arm holding Giant Calligraphy Brush -->
    <g class="brush-sway">
      <ellipse cx="242" cy="255" rx="12" ry="10" fill="#31333b"/>
      <!-- Wooden Brush Shaft -->
      <path d="M246 256 L 285 195" stroke="#8d5630" stroke-width="5" stroke-linecap="round"/>
      <path d="M285 195 L 290 186" stroke="#d4af37" stroke-width="4.5" stroke-linecap="round"/>
      <!-- Brush Tip with Ink -->
      <path d="M290 186 C 293 180 298 174 300 166 C 296 172 291 178 288 184 Z" fill="#2b2b2b"/>
      <!-- Golden ink glow on tip -->
      <circle cx="300" cy="166" r="3.5" fill="#fce594"/>
    </g>
  </g>

  <!-- Golden Calligraphy Arc Swirl (Nét mực thư pháp vàng bay bổng) -->
  <path class="ink-trail" d="M300 166 C 315 150 295 125 270 128 C 240 132 230 155 240 170" fill="none" stroke="url(#brushGoldGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>

  <!-- Magic Sparkles -->
  <g class="magic-sparkle" transform="translate(315, 145)">
    <path d="M0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#d4af37"/>
  </g>
  <g class="magic-sparkle" transform="translate(90, 160)">
    <path d="M0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#c8102e" opacity="0.85"/>
  </g>
  <circle cx="280" cy="115" r="2.5" fill="#fce594"/>
  <circle cx="110" cy="215" r="3" fill="#5ca38e"/>
</svg>
