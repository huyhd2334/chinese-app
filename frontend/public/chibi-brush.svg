<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Soft Jade Dragon Skin -->
    <linearGradient id="brushSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="35%" stop-color="#2dd4bf"/>
      <stop offset="80%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <!-- Royal Scholar Silk Robe (CHIA CẮT ĐẦU VÀ THÂN) -->
    <linearGradient id="brushRobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Golden Antlers & Robe Trims -->
    <linearGradient id="brushGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="45%" stop-color="#ffd54f"/>
      <stop offset="85%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>

    <!-- Warm Cream Belly -->
    <linearGradient id="brushBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <!-- Soft Muzzle Glow -->
    <radialGradient id="brushMuzzle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#99f6e4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <!-- Peach Blush -->
    <radialGradient id="brushBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Calligraphy Ink Glow -->
    <filter id="goldInkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .brush-motion {
      animation: brushSwayAnim 3.2s ease-in-out infinite;
      transform-origin: 240px 240px;
    }
    .dragon-breathe {
      animation: dragonNod 3.6s ease-in-out infinite;
      transform-origin: 200px 290px;
    }
    .tail-wag {
      animation: tailSwayAnim 3s ease-in-out infinite;
      transform-origin: 130px 290px;
    }
    .ink-shimmer {
      animation: inkFloat 3s ease-in-out infinite alternate;
    }

    @keyframes brushSwayAnim {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(8deg) translateY(-4px); }
    }
    @keyframes dragonNod {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes tailSwayAnim {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-6deg); }
    }
    @keyframes inkFloat {
      0% { opacity: 0.85; transform: translateY(0) scale(1); }
      100% { opacity: 1; transform: translateY(-5px) scale(1.04); }
    }
  </style>

  <!-- CLOUD BASE -->
  <g filter="url(#softDrop)">
    <ellipse cx="200" cy="355" rx="145" ry="30" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="130" cy="345" rx="46" ry="22" fill="#ffffff"/>
    <ellipse cx="270" cy="345" rx="46" ry="22" fill="#ffffff"/>
  </g>

  <!-- INKSTONE & INK DROPLET -->
  <g filter="url(#softDrop)">
    <ellipse cx="90" cy="335" rx="34" ry="16" fill="#1e293b"/>
    <ellipse cx="90" cy="334" rx="26" ry="11" fill="#0f172a"/>
    <ellipse cx="88" cy="333" rx="18" ry="7" fill="url(#brushGold)" opacity="0.85"/>
  </g>

  <!-- DRAGON TAIL (Uốn lượn bên trái) -->
  <g class="tail-wag">
    <path d="M 140 280 C 100 270, 65 285, 70 315 C 75 330, 100 325, 120 305 Z" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5"/>
    <path d="M 75 310 Q 50 295 45 316 Q 55 335 75 325 Z" fill="url(#brushGold)"/>
  </g>

  <!-- MAIN DRAGON SCHOLAR -->
  <g class="dragon-breathe" filter="url(#softDrop)">

    <!-- 1. DRAGON BODY (Thân múp) -->
    <ellipse cx="200" cy="275" rx="72" ry="68" fill="url(#brushSkin)"/>

    <!-- 2. HÁN PHỤC THƯ SINH ĐỎ SON VIỀN VÀNG (CHIA CẮT ĐẦU VÀ THÂN!) -->
    <path d="M 148 245 C 145 285, 150 315, 160 330 L 240 330 C 250 315, 255 285, 252 245 Z" fill="url(#brushRobe)"/>
    <path d="M 168 238 L 200 280 L 232 238" fill="none" stroke="url(#brushGold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Ngọc Bội Hoàng Gia Treo Trước Ngực -->
    <circle cx="200" cy="285" r="7" fill="url(#brushGold)"/>
    <circle cx="200" cy="285" r="4" fill="#2dd4bf"/>

    <!-- Bụng Vảy Rồng Màu Kem -->
    <ellipse cx="200" cy="318" rx="32" ry="16" fill="url(#brushBelly)"/>
    <path d="M 185 316 Q 200 322 215 316" fill="none" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>

    <!-- Chân Rồng Ngọc -->
    <ellipse cx="160" cy="338" rx="18" ry="12" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5"/>
    <ellipse cx="240" cy="338" rx="18" ry="12" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5"/>

    <!-- SỪNG RỒNG HOÀNG KIM -->
    <path d="M 152 125 C 142 95, 118 70, 102 60 C 112 75, 126 86, 134 110 C 120 100, 108 98, 98 102 C 114 112, 126 116, 140 128 Z" fill="url(#brushGold)"/>
    <path d="M 248 125 C 258 95, 282 70, 298 60 C 288 75, 274 86, 266 110 C 280 100, 292 98, 302 102 C 286 112, 274 116, 260 128 Z" fill="url(#brushGold)"/>

    <!-- 3. DRAGON HEAD (Má phúng phính đáng yêu, không viền oval cắt mặt!) -->
    <path d="M 145 135 C 130 150, 118 185, 130 212 C 142 238, 172 244, 200 244 C 228 244, 258 238, 270 212 C 282 185, 270 150, 255 135 C 235 115, 165 115, 145 135 Z" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5"/>

    <!-- Bờm Rồng Hoàng Kim 2 bên má -->
    <path d="M 134 205 C 118 210, 106 222, 110 234 C 118 230, 126 222, 140 218 Z" fill="url(#brushGold)"/>
    <path d="M 266 205 C 282 210, 294 222, 290 234 C 282 230, 274 222, 260 218 Z" fill="url(#brushGold)"/>

    <!-- Vây Tai Rồng -->
    <ellipse cx="126" cy="172" rx="17" ry="12" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5" transform="rotate(-20 126 172)"/>
    <ellipse cx="126" cy="172" rx="10" ry="6" fill="url(#brushGold)" transform="rotate(-20 126 172)"/>

    <ellipse cx="274" cy="172" rx="17" ry="12" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5" transform="rotate(20 274 172)"/>
    <ellipse cx="274" cy="172" rx="10" ry="6" fill="url(#brushGold)" transform="rotate(20 274 172)"/>

    <!-- Soft Muzzle Glow -->
    <ellipse cx="200" cy="204" rx="52" ry="28" fill="url(#brushMuzzle)"/>

    <!-- Má Đào Ửng Hồng -->
    <circle cx="146" cy="204" r="16" fill="url(#brushBlush)"/>
    <circle cx="254" cy="204" r="16" fill="url(#brushBlush)"/>

    <!-- Râu Rồng Hoàng Kim -->
    <path d="M 165 202 Q 132 204 114 220" fill="none" stroke="url(#brushGold)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 235 202 Q 268 204 286 220" fill="none" stroke="url(#brushGold)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- MŨI RỒNG LI TI (CÁCH XA MIỆNG 20px) -->
    <g opacity="0.85">
      <ellipse cx="193" cy="190" rx="2.5" ry="3" fill="#0f766e"/>
      <ellipse cx="207" cy="190" rx="2.5" ry="3" fill="#0f766e"/>
    </g>

    <!-- MIỆNG CƯỜI CHÚM CHÍM CÓ RĂNG KHỂNH XINH XẮN & LƯỠI HỒNG -->
    <path d="M 186 210 Q 200 226 214 210 Q 200 213 186 210 Z" fill="#9d0208" stroke="#0f766e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 192 218 Q 200 224 208 218 Q 200 214 192 218 Z" fill="#fb7185"/>
    <polygon points="189,211 193,211 191,215" fill="#ffffff"/>
    <polygon points="207,211 211,211 209,215" fill="#ffffff"/>

    <!-- ĐÔI MẮT LONG LANH CHĂM CHÚ VẼ THƯ PHÁP -->
    <g>
      <ellipse cx="164" cy="172" rx="13" ry="16" fill="#0f172a"/>
      <ellipse cx="164" cy="174" rx="11" ry="14" fill="#1e1b4b"/>
      <ellipse cx="164" cy="181" rx="8" ry="5" fill="#f59e0b" opacity="0.85"/>
      <circle cx="160" cy="167" r="5" fill="#ffffff"/>
      <circle cx="169" cy="179" r="2.5" fill="#ffffff"/>
      <path d="M 150 166 Q 164 154 178 166" fill="none" stroke="#090d16" stroke-width="2.8" stroke-linecap="round"/>

      <ellipse cx="236" cy="172" rx="13" ry="16" fill="#0f172a"/>
      <ellipse cx="236" cy="174" rx="11" ry="14" fill="#1e1b4b"/>
      <ellipse cx="236" cy="181" rx="8" ry="5" fill="#f59e0b" opacity="0.85"/>
      <circle cx="232" cy="167" r="5" fill="#ffffff"/>
      <circle cx="241" cy="179" r="2.5" fill="#ffffff"/>
      <path d="M 222 166 Q 236 154 250 166" fill="none" stroke="#090d16" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Ấn Ngọc Trán -->
    <ellipse cx="200" cy="138" rx="6" ry="8.5" fill="url(#brushGold)"/>
    <circle cx="200" cy="136" r="3.5" fill="#ffffff"/>

    <!-- Tay Trái Cầm Cuộn Thư Tịch -->
    <ellipse cx="140" cy="255" rx="14" ry="20" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5" transform="rotate(25 140 255)"/>
  </g>

  <!-- BÚT LÔNG THƯ PHÁP DÁT VÀNG (CALLIGRAPHY BRUSH) -->
  <g class="brush-motion" filter="url(#softDrop)">
    <!-- Tay Phải Cầm Bút Lông -->
    <ellipse cx="250" cy="245" rx="16" ry="22" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5" transform="rotate(-30 250 245)"/>
    <circle cx="265" cy="235" r="10" fill="url(#brushSkin)" stroke="#0d9488" stroke-width="1.5"/>

    <!-- Cán Bút Trúc Gỗ & Khâu Kim Loại Dát Vàng -->
    <rect x="262" y="145" width="8" height="95" rx="4" fill="#582f0e" transform="rotate(22 266 192)"/>
    <rect x="260" y="140" width="12" height="10" rx="3" fill="url(#brushGold)" transform="rotate(22 266 145)"/>

    <!-- Ngòi Lông Thỏ Dát Mực Vàng -->
    <path d="M 288 128 C 298 120, 310 115, 312 110 C 310 125, 298 138, 284 142 Z" fill="#1e293b"/>
    <path d="M 306 112 C 312 110, 316 106, 318 102 C 315 110, 310 116, 304 120 Z" fill="url(#brushGold)"/>
  </g>

  <!-- DẢI MỰC VÀNG PHÁT SÁNG & CHỮ "龙" THƯ PHÁP -->
  <g class="ink-shimmer" filter="url(#goldInkGlow)">
    <path d="M 315 105 C 335 85, 345 50, 310 40 C 275 30, 260 70, 290 85 C 320 100, 335 120, 350 140" fill="none" stroke="url(#brushGold)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="140" stroke-dashoffset="10"/>
    <text x="325" y="75" font-family="'Noto Serif SC', 'Songti SC', 'STSong', serif" font-size="34" font-weight="900" fill="url(#brushGold)" text-anchor="middle" filter="drop-shadow(0 2px 4px rgba(212,175,55,0.6))">龙</text>
  </g>
</svg>