<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <!-- Mini Chibi Tiểu Lu: Nháy mắt wink & giơ ngón cái No.1 (Rất dễ) -->
  <defs>
    <radialGradient id="easyBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b89" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ff7b89" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ears -->
  <circle cx="22" cy="22" r="11" fill="#31333b"/>
  <circle cx="22" cy="22" r="6" fill="#434752"/>
  <circle cx="58" cy="22" r="11" fill="#31333b"/>
  <circle cx="58" cy="22" r="6" fill="#434752"/>

  <!-- Chubby Head -->
  <circle cx="40" cy="42" r="28" fill="#ffffff" stroke="#eae0d5" stroke-width="1.5"/>

  <!-- Scholar Cap -->
  <path d="M33 16 C33 10 37 8 40 8 C43 8 47 10 47 16 Z" fill="#366c5d"/>
  <rect x="31" y="15" width="18" height="3" rx="1.5" fill="#20453b"/>
  <circle cx="40" cy="12" r="2" fill="#d4af37"/>

  <!-- Eye Patches -->
  <ellipse cx="28" cy="38" rx="8" ry="10" fill="#31333b" transform="rotate(-8 28 38)"/>
  <ellipse cx="52" cy="38" rx="8" ry="10" fill="#31333b" transform="rotate(8 52 38)"/>

  <!-- Left Eye: Big & Sparkly -->
  <circle cx="28" cy="38" r="4.5" fill="#1e2026"/>
  <circle cx="26.5" cy="36.5" r="2" fill="#ffffff"/>
  <circle cx="29.5" cy="39.5" r="1" fill="#ffffff"/>

  <!-- Right Eye: Playful Wink (^_~) -->
  <path d="M48 39 C50 35 54 35 56 39" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <ellipse cx="22" cy="48" rx="6" ry="4" fill="url(#easyBlush)"/>
  <ellipse cx="58" cy="48" rx="6" ry="4" fill="url(#easyBlush)"/>

  <!-- Nose & Confident Smile -->
  <circle cx="40" cy="43" r="1.8" fill="#31333b"/>
  <path d="M36 47 C39 52 44 49 45 46" fill="none" stroke="#31333b" stroke-width="2" stroke-linecap="round"/>

  <!-- Thumbs Up Paw (Bàn tay nhỏ giơ ngón cái No.1 cực ngầu) -->
  <g transform="translate(56, 44)">
    <circle cx="8" cy="8" r="6" fill="#31333b"/>
    <!-- Thumb sticking up -->
    <path d="M6 7 L6 2 C6 0.5 8 0.5 8 2 L8 7" fill="#31333b" stroke="#31333b" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Gold Star Twinkle -->
  <path d="M12 28 Q12 32 16 32 Q12 32 12 36 Q12 32 8 32 Q12 32 12 28 Z" fill="#d4af37"/>
</svg>
