<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 130" width="100%" height="100%">
  <defs>
    <!-- Soft Jade Dragon Skin -->
    <linearGradient id="peekSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="35%" stop-color="#2dd4bf"/>
      <stop offset="80%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>

    <!-- Golden Antlers & Details -->
    <linearGradient id="peekGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="45%" stop-color="#ffd54f"/>
      <stop offset="85%" stop-color="#ffa000"/>
      <stop offset="100%" stop-color="#ff6f00"/>
    </linearGradient>

    <!-- Peach Blush -->
    <radialGradient id="peekBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Muzzle Glow -->
    <radialGradient id="peekMuzzle" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ccfbf1" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#99f6e4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>

    <filter id="softDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <style>
    .peek-motion {
      animation: peekBob 3.6s ease-in-out infinite;
      transform-origin: 100px 120px;
    }
    .peek-blink {
      animation: peekBlink 4s ease-in-out infinite;
      transform-origin: 100px 72px;
    }
    .antler-sway {
      animation: antlerTwitch 4s ease-in-out infinite;
      transform-origin: 100px 45px;
    }

    @keyframes peekBob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes peekBlink {
      0%, 93%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.12); }
    }
    @keyframes antlerTwitch {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
    }
  </style>

  <!-- TWINKLING GOLDEN STARS -->
  <g>
    <path d="M 28 42 Q 33 42 33 37 Q 33 42 38 42 Q 33 42 33 47 Q 33 42 28 42 Z" fill="url(#peekGold)"/>
    <path d="M 168 35 Q 173 35 173 30 Q 173 35 178 35 Q 173 35 173 40 Q 173 35 168 35 Z" fill="url(#peekGold)"/>
    <circle cx="22" cy="70" r="2.5" fill="#ffd54f"/>
    <circle cx="178" cy="65" r="2.5" fill="#2dd4bf"/>
  </g>

  <!-- DRAGON PEEKING HEAD & PAWS -->
  <g class="peek-motion" filter="url(#softDrop)">

    <!-- Cổ áo gấm đỏ viền vàng lấp ló phía dưới (Chia cắt khối) -->
    <path d="M 68 112 Q 100 126 132 112 L 132 125 L 68 125 Z" fill="#b91c1c"/>
    <path d="M 68 112 Q 100 126 132 112" fill="none" stroke="url(#peekGold)" stroke-width="3" stroke-linecap="round"/>

    <!-- SỪNG RỒNG HOÀNG KIM -->
    <g class="antler-sway">
      <path d="M 76 52 C 68 32, 52 16, 42 10 C 48 20, 58 28, 62 44 C 54 36, 46 34, 38 38 C 48 44, 56 46, 68 54 Z" fill="url(#peekGold)"/>
      <path d="M 124 52 C 132 32, 148 16, 158 10 C 152 20, 142 28, 138 44 C 146 36, 154 34, 162 38 C 152 44, 144 46, 132 54 Z" fill="url(#peekGold)"/>
      <path d="M 95 38 Q 100 24 105 38 Z" fill="url(#peekGold)"/>
    </g>

    <!-- DRAGON HEAD (Má phúng phính đáng yêu) -->
    <path d="M 62 60 C 50 72, 42 94, 52 110 C 60 124, 80 128, 100 128 C 120 128, 140 124, 148 110 C 158 94, 150 72, 138 60 C 124 46, 76 46, 62 60 Z" fill="url(#peekSkin)" stroke="#0d9488" stroke-width="1.2"/>

    <!-- Bờm Rồng Hoàng Kim 2 bên má -->
    <path d="M 52 105 C 40 108, 32 116, 35 124 C 41 121, 47 116, 56 113 Z" fill="url(#peekGold)"/>
    <path d="M 148 105 C 160 108, 168 116, 165 124 C 159 121, 153 116, 144 113 Z" fill="url(#peekGold)"/>

    <!-- Vây Tai Rồng -->
    <ellipse cx="50" cy="80" rx="12" ry="8" fill="url(#peekSkin)" stroke="#0d9488" stroke-width="1" transform="rotate(-20 50 80)"/>
    <ellipse cx="50" cy="80" rx="7" ry="4" fill="url(#peekGold)" transform="rotate(-20 50 80)"/>

    <ellipse cx="150" cy="80" rx="12" ry="8" fill="url(#peekSkin)" stroke="#0d9488" stroke-width="1" transform="rotate(20 150 80)"/>
    <ellipse cx="150" cy="80" rx="7" ry="4" fill="url(#peekGold)" transform="rotate(20 150 80)"/>

    <!-- Soft Muzzle Glow -->
    <ellipse cx="100" cy="98" rx="36" ry="18" fill="url(#peekMuzzle)"/>

    <!-- Má Đào Ửng Hồng Phúng Phính -->
    <circle cx="64" cy="98" r="11" fill="url(#peekBlush)"/>
    <circle cx="136" cy="98" r="11" fill="url(#peekBlush)"/>

    <!-- Râu Rồng Hoàng Kim -->
    <path d="M 76 96 Q 55 98 44 108" fill="none" stroke="url(#peekGold)" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 124 96 Q 145 98 156 108" fill="none" stroke="url(#peekGold)" stroke-width="1.8" stroke-linecap="round"/>

    <!-- MŨI RỒNG LI TI (CÁCH XA MIỆNG) -->
    <g opacity="0.85">
      <ellipse cx="95" cy="90" rx="1.8" ry="2.2" fill="#0f766e"/>
      <ellipse cx="105" cy="90" rx="1.8" ry="2.2" fill="#0f766e"/>
    </g>

    <!-- MIỆNG CƯỜI CHÚM CHÍM CÓ RĂNG KHỂNH XINH XẮN & LƯỠI HỒNG -->
    <path d="M 91 102 Q 100 114 109 102 Q 100 104 91 102 Z" fill="#9d0208" stroke="#0f766e" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M 94 107 Q 100 112 106 107 Q 100 105 94 107 Z" fill="#fb7185"/>
    <polygon points="92,102 95,102 93.5,105" fill="#ffffff"/>
    <polygon points="105,102 108,102 106.5,105" fill="#ffffff"/>

    <!-- ĐÔI MẮT LONG LANH (CHỚP MẮT) -->
    <g class="peek-blink">
      <!-- Left Eye -->
      <g>
        <ellipse cx="76" cy="78" rx="9" ry="11" fill="#0f172a"/>
        <ellipse cx="76" cy="79" rx="7.5" ry="9.5" fill="#1e1b4b"/>
        <ellipse cx="76" cy="84" rx="5.5" ry="3.5" fill="#f59e0b" opacity="0.85"/>
        <circle cx="73" cy="74" r="3.5" fill="#ffffff"/>
        <circle cx="79" cy="82" r="1.8" fill="#ffffff"/>
        <path d="M 66 73 Q 76 65 86 73" fill="none" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Right Eye -->
      <g>
        <ellipse cx="124" cy="78" rx="9" ry="11" fill="#0f172a"/>
        <ellipse cx="124" cy="79" rx="7.5" ry="9.5" fill="#1e1b4b"/>
        <ellipse cx="124" cy="84" rx="5.5" ry="3.5" fill="#f59e0b" opacity="0.85"/>
        <circle cx="121" cy="74" r="3.5" fill="#ffffff"/>
        <circle cx="127" cy="82" r="1.8" fill="#ffffff"/>
        <path d="M 114 73 Q 124 65 134 73" fill="none" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Ấn Ngọc Trán -->
    <ellipse cx="100" cy="54" rx="4.5" ry="6" fill="url(#peekGold)"/>
    <circle cx="100" cy="52" r="2.5" fill="#ffffff"/>

    <!-- MÓNG RỒNG NGỌC BÁM MÉP DƯỚI (VỚI ĐỆM VÀNG MÚP) -->
    <g>
      <!-- Left Paw -->
      <ellipse cx="64" cy="120" rx="13" ry="9" fill="url(#peekSkin)" stroke="#0d9488" stroke-width="1"/>
      <circle cx="58" cy="118" r="2.2" fill="url(#peekGold)"/>
      <circle cx="64" cy="116" r="2.2" fill="url(#peekGold)"/>
      <circle cx="70" cy="118" r="2.2" fill="url(#peekGold)"/>

      <!-- Right Paw -->
      <ellipse cx="136" cy="120" rx="13" ry="9" fill="url(#peekSkin)" stroke="#0d9488" stroke-width="1"/>
      <circle cx="130" cy="118" r="2.2" fill="url(#peekGold)"/>
      <circle cx="136" cy="116" r="2.2" fill="url(#peekGold)"/>
      <circle cx="142" cy="118" r="2.2" fill="url(#peekGold)"/>
    </g>
  </g>
</svg>